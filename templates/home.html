{% extends 'master.html' %}

{% block title %}
home
{% endblock %}

{% block body %}
 <div class ='container'>
    <h2>home</h2>
 {% for product in products %}
 <h2>{{ product.name}}</h2>
 <p>Ksh. {{ product.price }}</p>
     <p>{{ product.category }}</p>
     <a href="{% url 'delete' product.id %}" class="btn btn-danger"><i class="bi bi-trash3"></i></a>
     <a href="{% url 'edit' product.id %}" class="btn btn-info"><i class="bi bi-pen"></i></a>
     <a href="{% url 'details' product.id %}" class="btn btn-success"><i class="bi bi-card-text"></i></a>


 <hr>
 {% endfor %}
    </div>

{% endblock %}
